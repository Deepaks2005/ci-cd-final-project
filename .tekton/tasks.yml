
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the source workspace before running the pipeline.
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        WORKSPACE_SOURCE_PATH="$(workspaces.source.path)"
        echo "Cleaning workspace: ${WORKSPACE_SOURCE_PATH}"
        rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
        rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
        rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Run Python unit tests with Nose.
  workspaces:
    - name: source
  params:
    - name: args
      type: string
      default: "-v"
  steps:
    - name: run-unit-tests-with-nose
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install nose
        echo "Running unit tests with Nose"
        nosetests $(params.args)
