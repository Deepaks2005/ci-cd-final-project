apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  params:
    - name: WORKSPACE_SOURCE_PATH
      description: The path of the workspace source
      type: string
  steps:
    - name: remove-workspace-files
      image: alpine:latest
      script: |
        #!/usr/bin/env sh
        echo "Cleaning up workspace at $(params.WORKSPACE_SOURCE_PATH)"
        rm -rf $(params.WORKSPACE_SOURCE_PATH)/*

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  params:
    - name: WORKSPACE_SOURCE_PATH
      description: The path of the workspace source
      type: string
  steps:
    - name: Run unit tests with nose
      image: python:3.9-slim
      workingDir: $(params.WORKSPACE_SOURCE_PATH)
      script: |
        #!/usr/bin/env python3
        pip install --no-cache-dir -r requirements.txt
        nosetests -v